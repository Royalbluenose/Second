<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit — Daily Routine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f3f5f7;
      --panel: rgba(255,255,255,0.76);
      --panel-solid: #ffffff;
      --line: #dfe5eb;
      --text: #1f2937;
      --muted: #667085;
      --green-soft: #eaf8ee;
      --green: #2f9d6c;
      --green-strong: #207a54;
      --blue: #2f6ae8;
      --blue-dark: #1e4ec7;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top, rgba(47, 157, 108, 0.12), transparent 32%),
        linear-gradient(180deg, #f5f7f9 0%, #eef2f5 100%);
      color: var(--text);
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--shadow);
    }

    .subtle-ring {
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.03);
    }
  </style>
</head>
<body class="text-gray-800 min-h-screen p-4 flex justify-center">

<div class="w-full max-w-md">
  <header class="glass rounded-[30px] px-4 pt-4 pb-3 mb-5 relative overflow-hidden">
    <div class="flex justify-between items-start mb-3">
      <div>
        <h1 class="text-[1.05rem] sm:text-[1.1rem] font-extrabold tracking-tight text-gray-900 flex items-center gap-2.5">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-xl bg-emerald-100 text-[#f59e0b] shadow-sm">⚡</span>
          <span>Daily Circuit Workout</span>
        </h1>
        <p id="exerciseCount" class="text-[0.7rem] text-gray-500 mt-1 font-medium"></p>
      </div>
      <div class="text-right">
        <div class="bg-white/90 text-gray-800 px-3 py-1.5 rounded-full text-[0.68rem] font-bold inline-block shadow-sm border border-gray-200" id="weekDisplay">
          Week 1
        </div>
        <div class="text-[0.68rem] text-gray-500 mt-1.5 font-semibold" id="dateRangeDisplay">
          <!-- Date range populates here -->
        </div>
      </div>
    </div>

    <div id="progressSummary" class="flex items-center justify-between gap-3 pt-2 border-t border-slate-200/80 text-[0.68rem] text-gray-500"></div>
  </header>

  <button type="button" onclick="openExerciseEditor()" class="w-full mb-3 bg-white/80 hover:bg-emerald-50 text-emerald-700 font-semibold py-2.5 px-4 rounded-2xl border border-emerald-200 shadow-sm text-sm">+ Add Exercise</button>
  <div id="exerciseList" class="space-y-3"></div>

  <div class="flex gap-2.5 mt-6">
    <button onclick="advanceWeek()" class="flex-1 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-blue-200/70 transition-all text-sm flex items-center justify-center gap-2 active:scale-[0.99]">
      <span>🚀</span> Next Week (+10%)
    </button>
    <button onclick="resetData()" class="bg-white/80 hover:bg-red-50 text-gray-600 hover:text-red-600 font-semibold py-3 px-4 rounded-2xl border border-slate-200 shadow-sm transition-all text-sm active:scale-[0.99]">
      Reset
    </button>
  </div>
  
  <div class="mt-3 flex gap-2.5">
    <button onclick="exportData()" class="flex-1 bg-white/80 hover:bg-slate-50 text-gray-700 font-medium py-2.5 px-3 rounded-2xl border border-slate-200 shadow-sm transition-all text-[0.7rem] flex items-center justify-center gap-1.5 active:scale-[0.99]">
      <span>💾</span> Export Backup
    </button>
    <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-white/80 hover:bg-slate-50 text-gray-700 font-medium py-2.5 px-3 rounded-2xl border border-slate-200 shadow-sm transition-all text-[0.7rem] flex items-center justify-center gap-1.5 active:scale-[0.99]">
      <span>📂</span> Import Backup
    </button>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
  </div>
</div>

<dialog id="exerciseDialog" class="w-[calc(100%-2rem)] max-w-md rounded-3xl p-0 shadow-2xl backdrop:bg-slate-900/40">
  <form id="exerciseForm" class="p-5 space-y-4">
    <h2 id="exerciseDialogTitle" class="text-lg font-bold text-slate-900">Add exercise</h2>
    <label class="block text-sm font-medium text-slate-700">Name
      <input id="exerciseName" required maxlength="60" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
    </label>
    <div class="grid grid-cols-2 gap-3">
      <label class="block text-sm font-medium text-slate-700">Starting target
        <input id="exerciseBase" type="number" min="1" step="1" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
      </label>
      <label class="block text-sm font-medium text-slate-700">Unit
        <select id="exerciseUnit" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
          <option value="reps">reps</option>
          <option value="sec">seconds</option>
        </select>
      </label>
    </div>
    <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
      <input id="exerciseWeighted" type="checkbox" class="h-4 w-4 accent-emerald-600"> Track a weight
    </label>
    <label class="block text-sm font-medium text-slate-700">Starting weight (kg)
      <input id="exerciseWeight" type="number" min="0" step="0.5" value="0" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
    </label>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" onclick="closeExerciseEditor()" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700">Cancel</button>
      <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white">Save exercise</button>
    </div>
  </form>
</dialog>

<div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium opacity-0 pointer-events-none transition-all duration-300 z-50">
</div>

<script>
  const defaultExercises = [
    { name: "Press-ups", base: 5, unit: "reps", weight: 0 },
    { name: "Pike Press-ups", base: 5, unit: "reps", weight: 0 },
    { name: "Prone Y, T, W Raises", base: 20, unit: "sec", weight: 1 },
    { name: "Resting Deep Squat", base: 30, unit: "sec", weight: 0 },
    { name: "Split Squats", base: 5, unit: "reps", weight: 0 },
    { name: "Calf Raises", base: 10, unit: "reps", weight: 0 },
    { name: "Plank", base: 30, unit: "sec", weight: 0 },
    { name: "Glute Bridges", base: 10, unit: "reps", weight: 10 },
    { name: "Seated Band Rows", base: 15, unit: "reps", weight: 0 },
    { name: "Neck Flexion", base: 10, unit: "reps", weight: 1 },
    { name: "Neck Extension", base: 15, unit: "reps", weight: 1 },
    { name: "Zottman Curl", base: 10, unit: "reps", weight: 5 }
  ];

  function getLocalDateKey(date) {
    const d = new Date(date);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function createDefaultState() {
    return {
      schemaVersion: 3,
      week: 1,
      startDate: new Date().toISOString(),
      lastResetDate: new Date().toISOString(),
      exercises: defaultExercises.map(ex => ({
        name: ex.name,
        base: ex.base,
        unit: ex.unit,
        weight: ex.weight || 0,
        weightEnabled: ex.weight > 0,
        baseline: ex.base,
        progressionStartWeek: 1,
        done: false
      }))
    };
  }

  function normalizeState(raw) {
    const baseState = createDefaultState();

    if (!raw || typeof raw !== 'object') {
      return baseState;
    }

    if (!Array.isArray(raw.exercises)) {
      return baseState;
    }

    const safeWeek = Number.isInteger(raw.week) && raw.week > 0 ? raw.week : 1;
    const safeStartDate = raw.startDate ? new Date(raw.startDate) : new Date();
    const safeLastResetDate = raw.lastResetDate ? new Date(raw.lastResetDate) : new Date();
    const safeExercises = raw.exercises.map((ex, index) => {
      const defaultExercise = defaultExercises.find(item => item.name.toLowerCase() === String(ex?.name || '').trim().toLowerCase())
        || defaultExercises[index];
      const unit = ex?.unit === 'sec' || ex?.unit === 'reps' ? ex.unit : defaultExercise?.unit || 'reps';
      const weight = Number.isFinite(Number(ex?.weight)) ? Math.max(0, Number(ex.weight)) : defaultExercise?.weight || 0;
      const base = Number.isFinite(Number(ex?.base)) ? Math.max(1, Number(ex.base)) : defaultExercise?.base || 1;
      return {
        name: typeof ex?.name === 'string' && ex.name.trim() ? ex.name.trim().slice(0, 60) : `Exercise ${index + 1}`,
        base,
        unit,
        weight,
        weightEnabled: typeof ex?.weightEnabled === 'boolean' ? ex.weightEnabled : weight > 0,
        baseline: Number.isFinite(Number(ex?.baseline)) ? Math.max(1, Number(ex.baseline)) : defaultExercise?.base || base,
        progressionStartWeek: Number.isInteger(ex?.progressionStartWeek)
          ? Math.min(safeWeek, Math.max(1, ex.progressionStartWeek))
          : 1,
        done: Boolean(ex?.done)
      };
    });
    if (raw.schemaVersion !== 3) {
      const existingNames = new Set(safeExercises.map(ex => ex.name.toLowerCase()));
      defaultExercises.forEach(ex => {
        if (!existingNames.has(ex.name.toLowerCase())) {
          safeExercises.push({ ...ex, weightEnabled: ex.weight > 0, baseline: ex.base, progressionStartWeek: 1, done: false });
        }
      });
    }

    return {
      schemaVersion: 3,
      week: safeWeek,
      startDate: Number.isNaN(safeStartDate.getTime()) ? new Date().toISOString() : safeStartDate.toISOString(),
      lastResetDate: Number.isNaN(safeLastResetDate.getTime()) ? new Date().toISOString() : safeLastResetDate.toISOString(),
      exercises: safeExercises
    };
  }

  const storedState = JSON.parse(localStorage.getItem('circuit_state_light') || 'null');
  let state = normalizeState(storedState);
  saveState();

  function resetDailyProgressIfNeeded() {
    const todayKey = getLocalDateKey(new Date());
    const lastResetKey = getLocalDateKey(new Date(state.lastResetDate || Date.now()));

    if (lastResetKey !== todayKey) {
      state.exercises = state.exercises.map(ex => ({ ...ex, done: false }));
      state.lastResetDate = new Date().toISOString();
      saveState();
    }
  }

  resetDailyProgressIfNeeded();

  function saveState() {
    localStorage.setItem('circuit_state_light', JSON.stringify(state));
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2500);
  }

  function getCalculatedTarget(base, week, progressionStartWeek = 1) {
    let multiplier = Math.pow(1.10, Math.max(0, week - progressionStartWeek));
    return Math.round(base * multiplier);
  }

  function formatExerciseTarget(ex) {
    const target = getCalculatedTarget(ex.base, state.week, ex.progressionStartWeek);
    if (ex.weightEnabled) {
      const weight = Number(ex.weight).toFixed(1).replace(/\.0$/, '');
      return `${target} ${ex.unit} / ${weight}kg`;
    }
    return `${target} ${ex.unit}`;
  }

  function getWeekStart(date) {
    const copy = new Date(date);
    const day = copy.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    copy.setDate(copy.getDate() + diff);
    copy.setHours(0, 0, 0, 0);
    return copy;
  }

  function updateDateRange() {
    const start = getWeekStart(new Date(state.startDate));
    start.setDate(start.getDate() + (state.week - 1) * 7);

    const end = new Date(start);
    end.setDate(end.getDate() + 6);

    const options = { month: 'short', day: 'numeric' };
    const startStr = start.toLocaleDateString('en-US', options);
    const endStr = end.toLocaleDateString('en-US', options);

    document.getElementById('dateRangeDisplay').innerText = `${startStr} - ${endStr}`;
  }

  function updateProgressSummary() {
    const total = state.exercises.length;
    const done = state.exercises.filter(ex => ex.done).length;
    const percent = total ? Math.round((done / total) * 100) : 0;
    const summary = document.getElementById('progressSummary');

    summary.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="inline-block h-2 w-2 rounded-full bg-emerald-500"></span>
        <span>Weekly target progression</span>
      </div>
      <div class="font-bold text-slate-700">${done}/${total} done · ${percent}%</div>
    `;
  }

  function render() {
    document.getElementById('weekDisplay').innerText = `Week ${state.week}`;
    document.getElementById('exerciseCount').textContent = `${state.exercises.length} exercises`;
    updateDateRange();
    updateProgressSummary();

    const container = document.getElementById('exerciseList');
    container.innerHTML = '';
    if (state.exercises.length === 0) {
      const emptyState = document.createElement('p');
      emptyState.className = 'rounded-2xl bg-white/80 p-5 text-center text-sm text-slate-500';
      emptyState.textContent = 'No exercises yet. Add one to get started.';
      container.appendChild(emptyState);
    }

    state.exercises.forEach((ex, index) => {
      const card = document.createElement('div');
      card.className = `subtle-ring p-3.5 rounded-[22px] border transition-all duration-200 flex flex-col gap-2.5 bg-white/90 shadow-[0_10px_18px_rgba(15,23,42,0.06)] ${ex.done ? 'bg-emerald-50/80 border-emerald-200' : 'border-slate-200'}`;

      const row = document.createElement('div');
      row.className = 'flex justify-between items-center gap-2';

      const name = document.createElement('div');
      name.className = 'text-sm font-bold text-gray-900 truncate';
      name.textContent = ex.name;

      const targetGroup = document.createElement('div');
      targetGroup.className = 'flex items-center gap-2';

      const target = document.createElement('div');
      target.className = 'text-xs sm:text-sm font-bold text-emerald-700 bg-emerald-100/80 px-2 py-1.5 rounded-xl border border-emerald-100 whitespace-nowrap';
      target.textContent = formatExerciseTarget(ex);
      targetGroup.appendChild(target);

      row.appendChild(name);
      row.appendChild(targetGroup);

      const actionRow = document.createElement('div');
      actionRow.className = `flex items-center gap-2 pt-1 border-t ${ex.done ? 'border-emerald-200/70' : 'border-slate-200'}`;

      const minus = document.createElement('button');
      minus.type = 'button';
      minus.setAttribute('aria-label', `Decrease ${ex.name}`);
      minus.className = 'w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-gray-600 font-bold text-base flex items-center justify-center transition-colors active:scale-95';
      minus.textContent = '-';
      minus.addEventListener('click', () => adjustBase(index, -1));

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.setAttribute('aria-label', ex.done ? `Mark ${ex.name} as not done` : `Mark ${ex.name} as done`);
      toggle.className = `flex-1 py-2 px-3 rounded-xl font-semibold text-[0.72rem] transition-all flex items-center justify-center gap-1.5 ${ex.done ? 'bg-emerald-600 text-white shadow-inner' : 'bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 shadow-sm'}`;
      toggle.innerHTML = `<span>${ex.done ? '✓ Completed' : 'Mark Done'}</span>`;
      toggle.addEventListener('click', () => toggleDone(index));

      const plus = document.createElement('button');
      plus.type = 'button';
      plus.setAttribute('aria-label', `Increase ${ex.name}`);
      plus.className = 'w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-gray-600 font-bold text-base flex items-center justify-center transition-colors active:scale-95';
      plus.textContent = '+';
      plus.addEventListener('click', () => adjustBase(index, 1));

      actionRow.appendChild(minus);
      actionRow.appendChild(toggle);
      actionRow.appendChild(plus);

      let loadRow = null;
      if (ex.weightEnabled) {
        loadRow = document.createElement('div');
        loadRow.className = 'flex items-center justify-end gap-2 mt-1';

        const weightMinus = document.createElement('button');
        weightMinus.type = 'button';
        weightMinus.setAttribute('aria-label', `Decrease ${ex.name} load by 0.5 kilograms`);
        weightMinus.className = 'rounded-lg bg-slate-100 hover:bg-slate-200 text-gray-600 font-bold text-[0.6rem] px-2 py-1 flex items-center justify-center';
        weightMinus.textContent = '-0.5kg';
        weightMinus.addEventListener('click', () => adjustWeight(index, -0.5));

        const weightPlus = document.createElement('button');
        weightPlus.type = 'button';
        weightPlus.setAttribute('aria-label', `Increase ${ex.name} load by 0.5 kilograms`);
        weightPlus.className = 'rounded-lg bg-slate-100 hover:bg-slate-200 text-gray-600 font-bold text-[0.6rem] px-2 py-1 flex items-center justify-center';
        weightPlus.textContent = '+0.5kg';
        weightPlus.addEventListener('click', () => adjustWeight(index, 0.5));

        loadRow.appendChild(weightMinus);
        loadRow.appendChild(weightPlus);
      }

      card.appendChild(row);
      card.appendChild(actionRow);
      if (loadRow) card.appendChild(loadRow);

      const manageRow = document.createElement('div');
      manageRow.className = 'flex justify-between gap-3 border-t border-slate-200 pt-2';
      const moveControls = document.createElement('div');
      moveControls.className = 'flex gap-2';
      const moveUpButton = document.createElement('button');
      moveUpButton.type = 'button';
      moveUpButton.className = 'text-xs font-semibold text-slate-500 hover:text-emerald-700 disabled:opacity-30';
      moveUpButton.textContent = '↑ Up';
      moveUpButton.disabled = index === 0;
      moveUpButton.setAttribute('aria-label', `Move ${ex.name} up`);
      moveUpButton.addEventListener('click', () => moveExercise(index, -1));
      const moveDownButton = document.createElement('button');
      moveDownButton.type = 'button';
      moveDownButton.className = 'text-xs font-semibold text-slate-500 hover:text-emerald-700 disabled:opacity-30';
      moveDownButton.textContent = '↓ Down';
      moveDownButton.disabled = index === state.exercises.length - 1;
      moveDownButton.setAttribute('aria-label', `Move ${ex.name} down`);
      moveDownButton.addEventListener('click', () => moveExercise(index, 1));
      moveControls.appendChild(moveUpButton);
      moveControls.appendChild(moveDownButton);
      manageRow.appendChild(moveControls);

      const editControls = document.createElement('div');
      editControls.className = 'flex gap-3';
      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.className = 'text-xs font-semibold text-slate-500 hover:text-emerald-700';
      editButton.textContent = 'Edit';
      editButton.setAttribute('aria-label', `Edit ${ex.name}`);
      editButton.addEventListener('click', () => openExerciseEditor(index));
      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'text-xs font-semibold text-slate-500 hover:text-red-600';
      deleteButton.textContent = 'Delete';
      deleteButton.setAttribute('aria-label', `Delete ${ex.name}`);
      deleteButton.addEventListener('click', () => deleteExercise(index));
      editControls.appendChild(editButton);
      editControls.appendChild(deleteButton);
      manageRow.appendChild(editControls);
      card.appendChild(manageRow);
      container.appendChild(card);
    });
  }

  function toggleDone(index) {
    state.exercises[index].done = !state.exercises[index].done;
    state.lastResetDate = new Date().toISOString();
    saveState();
    render();
  }

  function adjustBase(index, amount) {
    state.exercises[index].base = Math.max(1, state.exercises[index].base + amount);
    state.exercises[index].baseline = state.exercises[index].base;
    saveState();
    render();
  }

  function adjustWeight(index, amount) {
    state.exercises[index].weight = Math.max(0, Number((state.exercises[index].weight + amount).toFixed(1)));
    if (amount > 0) {
      state.exercises[index].base = state.exercises[index].baseline;
      state.exercises[index].progressionStartWeek = state.week;
    }
    saveState();
    render();
    if (amount > 0) showToast('Load increased; reps reset to baseline.');
  }

  function moveExercise(index, direction) {
    const destination = index + direction;
    if (destination < 0 || destination >= state.exercises.length) return;
    [state.exercises[index], state.exercises[destination]] = [state.exercises[destination], state.exercises[index]];
    saveState();
    render();
  }

  let editingExerciseIndex = null;
  const exerciseDialog = document.getElementById('exerciseDialog');
  const exerciseForm = document.getElementById('exerciseForm');
  const exerciseWeightedInput = document.getElementById('exerciseWeighted');
  const exerciseWeightInput = document.getElementById('exerciseWeight');

  exerciseWeightedInput.addEventListener('change', () => {
    exerciseWeightInput.disabled = !exerciseWeightedInput.checked;
    if (!exerciseWeightedInput.checked) exerciseWeightInput.value = '0';
  });

  function openExerciseEditor(index = null) {
    editingExerciseIndex = index;
    exerciseForm.reset();
    const exercise = index === null ? null : state.exercises[index];
    document.getElementById('exerciseDialogTitle').textContent = exercise ? 'Edit exercise' : 'Add exercise';
    document.getElementById('exerciseName').value = exercise?.name || '';
    document.getElementById('exerciseBase').value = exercise?.base || 10;
    document.getElementById('exerciseUnit').value = exercise?.unit || 'reps';
    exerciseWeightedInput.checked = Boolean(exercise?.weightEnabled);
    exerciseWeightInput.value = exercise ? String(exercise.weight) : '0';
    exerciseWeightInput.disabled = !exerciseWeightedInput.checked;
    exerciseDialog.showModal();
  }

  function closeExerciseEditor() {
    exerciseDialog.close();
  }

  exerciseForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = document.getElementById('exerciseName').value.trim();
    const base = Number(document.getElementById('exerciseBase').value);
    const unit = document.getElementById('exerciseUnit').value;
    const weightEnabled = exerciseWeightedInput.checked;
    const weight = weightEnabled ? Number(exerciseWeightInput.value) : 0;
    const duplicate = state.exercises.some((exercise, index) =>
      index !== editingExerciseIndex && exercise.name.toLowerCase() === name.toLowerCase()
    );

    if (!name || !Number.isFinite(base) || base < 1 || !Number.isFinite(weight) || weight < 0 || duplicate) {
      showToast(duplicate ? 'An exercise with that name already exists.' : 'Enter a valid name, target, and weight.');
      return;
    }

    if (editingExerciseIndex === null) {
      state.exercises.push({
        name, base, baseline: base, unit, weight, weightEnabled,
        progressionStartWeek: state.week,
        done: false
      });
    } else {
      const exercise = state.exercises[editingExerciseIndex];
      if (exercise.base !== base) {
        exercise.base = base;
        exercise.baseline = base;
        exercise.progressionStartWeek = state.week;
      }
      exercise.name = name;
      exercise.unit = unit;
      exercise.weight = weight;
      exercise.weightEnabled = weightEnabled;
    }

    saveState();
    render();
    closeExerciseEditor();
    showToast(editingExerciseIndex === null ? 'Exercise added.' : 'Exercise updated.');
  });

  function deleteExercise(index) {
    const exercise = state.exercises[index];
    if (!confirm(`Delete ${exercise.name}? This removes it from your routine.`)) return;
    state.exercises.splice(index, 1);
    saveState();
    render();
    showToast('Exercise deleted.');
  }

  function advanceWeek() {
    if (confirm('Move to the next week? This will scale up your targets by ~10%, update your dates, and reset today\'s checkmarks.')) {
      state.week++;
      state.exercises.forEach(ex => ex.done = false);
      state.lastResetDate = new Date().toISOString();
      saveState();
      render();
      showToast(`Advanced to Week ${state.week}! Targets scaled up.`);
    }
  }

  function resetData() {
    if (confirm('Reset all progress back to Week 1?')) {
      localStorage.removeItem('circuit_state_light');
      state = createDefaultState();
      render();
      saveState();
      showToast('Reset to initial state');
    }
  }

  function exportData() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `circuit-backup-week-${state.week}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Backup exported successfully');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedState = JSON.parse(e.target.result);
        const normalized = normalizeState(importedState);
        state = normalized;
        saveState();
        render();
        showToast('Backup imported successfully');
      } catch (err) {
        showToast('Invalid backup file');
      }
    };
    reader.readAsText(file);
  }

  render();
</script>

</body>
</html>
